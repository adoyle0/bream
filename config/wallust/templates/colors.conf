set -g status-left "#[fg={{background}},bg={{color12}},bold] #S "
set -g status-style "fg={{foreground}},bg={{background}}"
set -g window-status-style "fg={{background}},bg={{color4}}"
set -g window-status-current-style "fg={{background}},bg={{color12}},bold"
set -g message-style "fg={{background}},bg={{color12}}"
set -g pane-border-style "fg={{color2}}"
set -g pane-active-border-style "fg={{color10}}"
set -g mode-style "fg={{foreground}},bg={{color2}}"
set -g clock-mode-colour "{{color4}}"
set -g status-right ""
